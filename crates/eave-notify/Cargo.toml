[package]
name = "eave-notify"
version = "0.1.0"
description = "A freedesktop notification server for eave plugins"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Broadcasts what arrives to every watcher, starts the server once, and waits for the name (D-48).
# The bar's runtime, already in the build through iced.
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
# Serves org.freedesktop.Notifications on the session bus. The same zbus eave-dbus uses (D-7).
zbus = { version = "5", default-features = false, features = ["tokio"] }
