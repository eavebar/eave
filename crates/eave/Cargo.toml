[package]
name = "eave"
version = "0.1.0"
description = "A status bar for Hyprland"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eave-api.workspace = true
# Reports clicks anywhere while a popover is open, so a click outside closes it (D-14).
eave-hyprland.workspace = true
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "wayland", "tokio", "crisp", "advanced", "canvas", "image-without-codecs"] }
# App icons (D-38): draws SVG icons, and through its tiny-skia decodes and scales PNG ones, into
# small bitmaps. No text, fonts or embedded raster images, which app icons don't need.
resvg = { version = "0.45", default-features = false }
# Loads app icons on the blocking pool, and times notification cards. Already in the build through
# iced's tokio backend.
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
iced_layershell = "0.19"
# Markdown (D-62): Claude's replies and plans. Just the parser, no HTML writer or SIMD; iced's own
# markdown feature would add its widget and url parsing on top.
pulldown-cmark = { version = "0.13", default-features = false }
# Cover art (D-57): JPEG, the format most covers come in. PNG goes through tiny-skia, like icons.
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "neon", "x86"] }
# Cover art over https (D-57), fetched on the blocking pool. Checked against the system's CA
# certificates, not a bundled list; rustls on ring.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
toml.workspace = true
# inotify for config hot reload (D-21); already in the tree through the Wayland stack.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
# iced_exdevtools 0.19.1 fails to build against winit-core beta.3 (new Key variant); drop once fixed upstream.
winit-core = "=0.31.0-beta.2"
# Built-in plugins, only used by the default binary (src/main.rs).
eave-battery = { workspace = true, optional = true }
eave-clock = { workspace = true, optional = true }
eave-keyboard = { workspace = true, optional = true }
eave-media = { workspace = true, optional = true }
eave-network = { workspace = true, optional = true }
eave-volume = { workspace = true, optional = true }
eave-window = { workspace = true, optional = true }
eave-workspaces = { workspace = true, optional = true }

[features]
default = ["builtin", "gpu"]
builtin = [
    "dep:eave-battery",
    "dep:eave-clock",
    "dep:eave-keyboard",
    "dep:eave-media",
    "dep:eave-network",
    "dep:eave-volume",
    "dep:eave-window",
    "dep:eave-workspaces",
]
# GPU renderer (wgpu), the default since D-67; tiny-skia stays as fallback, and is what
# `renderer = "cpu"` in config.toml picks. Without this feature the bar is CPU-only.
gpu = ["iced/wgpu"]

[[bin]]
name = "eave"
required-features = ["builtin"]
