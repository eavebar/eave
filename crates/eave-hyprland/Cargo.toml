[package]
name = "eave-hyprland"
version = "0.2.0"
description = "Hyprland IPC for eave plugins: one shared event stream, plus queries and dispatches"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# All already in the tree through iced; only the features we use.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["net", "io-util", "sync", "time", "rt"] }
serde.workspace = true
# Socket1 replies to `j/` requests are JSON.
serde_json = { version = "1", default-features = false, features = ["std"] }
