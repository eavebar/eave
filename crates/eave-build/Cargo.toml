[package]
name = "eave-build"
version = "0.1.0"
description = "Builds and updates an eave binary with the plugins config.toml uses"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
toml = { version = "0.9", default-features = false, features = ["std", "parse", "display", "serde"] }
# Signals for --restart; already in the tree (D-21).
rustix = { version = "1", default-features = false, features = ["std", "process"] }
