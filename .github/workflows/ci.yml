# Builds, tests and lints on both targets (AGENTS.md: keep aarch64 and x86_64 building), and runs
# install.sh for real, and the AUR package from this commit. The package ships only eave-build:
# eave compiles plugins in, so the bar is always built locally (D-12, D-54).
# The step installing libxkbcommon-dev appears in both jobs below.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # smithay-client-toolkit's build script finds xkbcommon through pkg-config. Arch with
      # Hyprland has both already; a bare Ubuntu runner doesn't.
      - run: sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends libxkbcommon-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked --all-targets
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: matrix.arch == 'x86_64'
        run: cargo fmt --all --check

  install:
    # The real script, from this checkout: eave-build, starter config, units, a full build.
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # smithay-client-toolkit's build script finds xkbcommon through pkg-config. Arch with
      # Hyprland has both already; a bare Ubuntu runner doesn't.
      - run: sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends libxkbcommon-dev pkg-config
      - run: shellcheck install.sh
      - name: install.sh
        run: EAVE_REPO="$GITHUB_WORKSPACE" sh install.sh
      - name: installed, and a second build changes nothing
        run: |
          test -x ~/.local/bin/eave
          test -f ~/.config/eave/config.toml
          test -f ~/.config/systemd/user/eave-rebuild.path
          ~/.cargo/bin/eave-build 2>&1 | tee build.log
          grep -q 'is up to date' build.log

  aur:
    # dist/aur/eave, built from this commit instead of the release tarball it names.
    needs: check
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust pkgconf libxkbcommon namcap
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pkgver=$(sed -n 's/^pkgver=//p' dist/aur/eave/PKGBUILD)
          useradd -m builder
          dir=/home/builder/eave
          mkdir "$dir"
          cp dist/aur/eave/PKGBUILD dist/aur/eave/eave.install dist/aur/eave/.SRCINFO "$dir"
          git archive --prefix="eave-$pkgver/" -o "$dir/eave-$pkgver.tar.gz" HEAD
          chown -R builder "$dir"
          cd "$dir"
          su builder -c 'makepkg --printsrcinfo' | diff -u .SRCINFO -
          # Hyprland isn't installed here: it's a runtime dependency only.
          su builder -c 'makepkg --nodeps --skipchecksums --noconfirm'
          namcap PKGBUILD eave-*.pkg.tar.zst
          # EAVE_PACKAGE took effect: the bar defaults to this release.
          bsdtar -xOf eave-*.pkg.tar.zst usr/bin/eave-build | grep -aq "eaveshell/eave@v$pkgver"
