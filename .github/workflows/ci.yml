# Builds, tests and lints on both targets (AGENTS.md: keep aarch64 and x86_64 building), and runs
# install.sh for real. No releases: eave compiles plugins in, so it is always built locally (D-12).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked --all-targets
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: matrix.arch == 'x86_64'
        run: cargo fmt --all --check

  install:
    # The real script, from this checkout: eave-build, starter config, units, a full build.
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: shellcheck install.sh
      - name: install.sh
        run: EAVE_REPO="$GITHUB_WORKSPACE" sh install.sh
      - name: installed, and a second build changes nothing
        run: |
          test -x ~/.local/bin/eave
          test -f ~/.config/eave/config.toml
          test -f ~/.config/systemd/user/eave-rebuild.path
          ~/.cargo/bin/eave-build 2>&1 | tee build.log
          grep -q 'is up to date' build.log
