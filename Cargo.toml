[workspace]
resolver = "3"
members = [
    "crates/eave",
    "crates/eave-api",
    "crates/eave-build",
    "crates/eave-dbus",
    "crates/eave-hyprland",
    "crates/eave-iwd",
    "crates/eave-mpris",
    "crates/eave-net",
    "crates/eave-pulse",
    "plugins/battery",
    "plugins/brightness",
    "plugins/clock",
    "plugins/keyboard",
    "plugins/media",
    "plugins/network",
    "plugins/volume",
    "plugins/window",
    "plugins/workspaces",
]
default-members = ["crates/eave"]
# Patched copies of upstream crates, not ours to test or lint.
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/eaveshell/eave"

[workspace.dependencies]
eave-api = { path = "crates/eave-api", version = "0.1.4" }
eave = { path = "crates/eave", version = "0.1.0" }
eave-dbus = { path = "crates/eave-dbus", version = "0.1.1" }
eave-pulse = { path = "crates/eave-pulse", version = "0.1.0" }
eave-hyprland = { path = "crates/eave-hyprland", version = "0.1.0" }
eave-iwd = { path = "crates/eave-iwd", version = "0.1.0" }
eave-mpris = { path = "crates/eave-mpris", version = "0.1.0" }
eave-net = { path = "crates/eave-net", version = "0.1.0" }
eave-battery = { path = "plugins/battery", version = "0.1.0" }
eave-brightness = { path = "plugins/brightness", version = "0.1.0" }
eave-clock = { path = "plugins/clock", version = "0.1.0" }
eave-keyboard = { path = "plugins/keyboard", version = "0.1.0" }
eave-media = { path = "plugins/media", version = "0.1.0" }
eave-network = { path = "plugins/network", version = "0.1.0" }
eave-volume = { path = "plugins/volume", version = "0.1.0" }
eave-window = { path = "plugins/window", version = "0.1.0" }
eave-workspaces = { path = "plugins/workspaces", version = "0.1.0" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }

# softbuffer's Wayland backend hardcodes `Xrgb8888`, so the compositor drops the alpha channel and
# every transparent pixel shows as black. Our copy uses `Argb8888` (D-25).
[patch.crates-io]
softbuffer = { path = "vendor/softbuffer" }
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
layershellev = { path = "vendor/layershellev" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
