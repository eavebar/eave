[workspace]
resolver = "3"
members = ["crates/eave", "crates/eave-api", "crates/eave-build", "plugins/clock"]
default-members = ["crates/eave"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/francescomengarelli/eave"

[workspace.dependencies]
eave-api = { path = "crates/eave-api", version = "0.1.0" }
eave = { path = "crates/eave", version = "0.1.0" }
eave-clock = { path = "plugins/clock", version = "0.1.0" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
