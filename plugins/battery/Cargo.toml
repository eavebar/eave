[package]
name = "eave-battery"
version = "0.1.0"
description = "Battery level, with time left and power draw in the popover, for eave"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eave-api.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The uevent socket; already in the tree (D-21). `fs` only because rustix 1.1 fails to build
# `net` alone (its socket timeouts need `timespec`).
rustix = { version = "1", default-features = false, features = ["std", "net", "fs"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
serde.workspace = true

[dev-dependencies]
toml.workspace = true
