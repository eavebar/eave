# eave: which widgets go where. Changes apply as soon as you save.
#
# Zones are [[left]], [[center]] and [[right]], in order. Every key except `widget` goes to the
# widget. `widget` is a built-in name, or a plugin's source: `someone/weather` (GitHub),
# `someone/weather@v0.2` (pinned), a git URL, or a local path. Adding a plugin rebuilds the bar
# (automatic with eave-rebuild.path). See docs/plugins.md.
#
# Entries without a widget arrange the zone: `island = true` starts another island beside the last,
# `divider = true` puts a line before the next item. `collapsible = true` on an item hides it until
# you press the chevron that shows when you hover its island, or for a moment when it changes.
# `live = true` beside `island = true` makes that island a live one: snugger and rounder. Before a
# zone's first item, it applies to the first island.

[[left]]
widget = "workspaces"

[[left]]
widget = "window"

[[center]]
widget = "clock"

[[right]]
widget = "volume"

[[right]]
widget = "network"

[[right]]
widget = "battery"
